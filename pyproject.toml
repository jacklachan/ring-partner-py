[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-partner"
version = "0.1.0"
description = "Unofficial async Python client for the Ring Partner API, with webhook verification and a local stand-in for tests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
standin = ["fastapi>=0.115", "pillow>=10"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fastapi>=0.115", "pillow>=10"]

[project.scripts]
ring-partner = "ring_partner.cli:main"

[project.urls]
Repository = "https://github.com/jacklachan/ring-partner-py"

[tool.setuptools.packages.find]
include = ["ring_partner*"]

[tool.setuptools.package-data]
ring_partner = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
